name: Manh Moi Cloud Bot (24/7)

on:
  schedule:
    # Tự động thức dậy mỗi 30 phút để lắng nghe lệnh Telegram & chạy lịch hẹn giờ đăng Threads
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: manh-moi-telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Telegram + Threads Bot Window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          AUTO_PUBLISH_THREADS: "true"
          CLOUD_RUN_MINUTES: "28"
        run: python -u telegram_bot/cloud_runner.py

      - name: Commit updated content-log.csv and schedule.json
        run: |
          git config user.name "Manh Moi AI Bot"
          git config user.email "ntminh626@gmail.com"
          git add content-log.csv telegram_bot/schedule.json telegram_bot/used_images.json || true
          git diff --staged --quiet || (git commit -m "chore: auto-update content-log and schedule" && git push)

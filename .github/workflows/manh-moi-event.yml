name: Manh Moi Event (Telegram webhook -> xử lý 1 lệnh)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "cmd = xử lý 1 lệnh Telegram, tick = kiểm tra lịch hẹn"
        default: "cmd"
      chat_id:
        description: "Telegram chat id"
        default: ""
      text:
        description: "Nội dung lệnh"
        default: ""

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Xử lý lệnh
        env:
          EVENT_KIND: ${{ inputs.kind }}
          EVENT_CHAT_ID: ${{ inputs.chat_id }}
          EVENT_TEXT: ${{ inputs.text }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          AUTO_PUBLISH_THREADS: "true"
        run: python -u telegram_bot/cloud_once.py

      - name: Lưu trạng thái (log, nháp, lịch)
        if: always()
        run: |
          git config user.name "Manh Moi AI Bot"
          git config user.email "ntminh626@gmail.com"
          git add content-log.csv telegram_bot/schedule.json telegram_bot/used_images.json telegram_bot/drafts.json telegram_bot/topic_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update state"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && break
              sleep $((RANDOM % 5 + 2))
            done
          fi